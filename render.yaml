services:
  - type: web
    name: trackflow
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      # Los tres valores se definen en el dashboard de Render, nunca en este archivo.
      - key: TRACKFLOW_DB_URL
        sync: false
      - key: TRACKFLOW_DB_USER
        sync: false
      - key: TRACKFLOW_DB_PASSWORD
        sync: false
