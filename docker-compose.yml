services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: trackflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: trackflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trackflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - trackflow-pgdata:/var/lib/postgresql/data

volumes:
  trackflow-pgdata:
