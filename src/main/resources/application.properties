spring.application.name=md_eventos

# Render (y cualquier PaaS) inyecta el puerto por la variable PORT.
server.port=${PORT:8080}

spring.datasource.url=${TRACKFLOW_DB_URL:jdbc:postgresql://localhost:5432/trackflow}
spring.datasource.username=${TRACKFLOW_DB_USER:postgres}
spring.datasource.password=${TRACKFLOW_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true
server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html
